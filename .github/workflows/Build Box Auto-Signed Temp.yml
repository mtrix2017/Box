name: Build Box Auto-Signed Temp
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ✅ 正确地址 android-actions/setup-android@v4，不是 actions/setup-android
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-box-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Create empty local.properties
        run: touch local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew assembleArm64GenericNormalRelease

      # 自动生成临时jks证书
      - name: Generate temp keystore
        run: |
          keytool -genkey -noprompt \
            -alias test \
            -dname "CN=Test, OU=Test, O=Test, L=Test, S=Test, C=CN" \
            -keystore test.jks \
            -storepass 123456 \
            -keypass 123456 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      # 签名，开启V2 V3
      - name: Sign APK
        run: |
          apksigner sign \
            --ks test.jks \
            --ks-pass pass:123456 \
            --key-pass pass:123456 \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            app/build/outputs/apk/arm64GenericNormal/release/app-arm64GenericNormal-release.apk

      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Box-直接可装成品
          path: app/build/outputs/apk/arm64GenericNormal/release/app-arm64GenericNormal-release.apk
