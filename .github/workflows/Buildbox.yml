name: Build Box
on:
  workflow_dispatch: # 支持手动点击运行（重点！）
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 设置JDK17（takagen99的Box必须JDK17，解决JVM-target报错）
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 缓存Gradle依赖，加速下次编译
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: 阿里云Maven镜像替换（解决国内依赖拉取超时）
        run: |
          sed -i 's/mavenCentral()/maven { url "https:\/\/maven.aliyun.com\/repository\/public" }\nmavenCentral()/g' settings.gradle.kts
          sed -i 's/google()/maven { url "https:\/\/maven.aliyun.com\/repository\/google" }\ngoogle()/g' settings.gradle.kts

      - name: 编译 arm64GenericRelease（TV盒子版本）
        run: ./gradlew assembleArm64GenericRelease

      - name: 上传编译产物APK
        uses: actions/upload-artifact@v4
        with:
          name: Box-ARM64-Release
          path: app/build/outputs/apk/arm64Generic/release/*.apk
