name: Build Box
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 设置JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 缓存Gradle依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: 写入全局阿里云镜像（init.gradle）
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        mavenCentral()
        google()
    }
    buildscript {
        repositories {
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        }
    }
}
EOF

      - name: 自动注入 kotlin jvmTarget = 1.8
        run: sed -i '/android {/a kotlinOptions { jvmTarget = "1.8" }' app/build.gradle.kts

      - name: 编译 arm64GenericRelease（TV盒子版）
        run: ./gradlew assembleArm64GenericRelease

      - name: 上传编译产物APK
        uses: actions/upload-artifact@v4
        with:
          name: Box-ARM64-Release
          path: app/build/outputs/apk/arm64Generic/release/*.apk
